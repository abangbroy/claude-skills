# Starter CI for a Node + Postgres web app. Adapt names, versions and env.
# Lean by design: free CI minutes run out, and when they do every workflow stops (backups too).
#
# No `paths:` filter on the trigger. A workflow skipped by a path filter never reports a status,
# so a required check stays "Pending" forever and a docs-only PR can't merge. Instead the workflow
# always starts, the cheap `scope` job decides, and jobs skipped by an `if:` report success.
name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # Docs-only changes skip the expensive jobs. Prompts are code even though they are .md files.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true   # when in doubt (new branch, fetch failed), run everything
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            if ! git diff --name-only "$BASE_SHA" HEAD | awk '(!/^docs\// && !/\.md$/) || /^prompts\//' | grep -q .; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - name: Applied migrations are never edited
        # A merged migration has already run on staging (maybe production); editing it changes nothing there.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-status --diff-filter=MDR "$BASE_SHA" HEAD -- supabase/migrations/)
          if [ -n "$changed" ]; then
            echo "$changed" | while read -r status path _; do
              echo "::error file=$path::Applied migration changed ($status). Add a new NNNN_description.sql instead."
            done
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_e2e
      # Offline fakes for every paid service:
      AI_PROVIDER: fake
      PAYMENT_GATEWAY: fake
      EMAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:local
      - run: npm run seed:dev
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

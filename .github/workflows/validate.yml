# Keeps the skills valid and the uploadable dist/*.skill files in sync with skills/.
# A broken frontmatter, a dead link or a stale .skill file is found here, not when someone uploads it.
name: Validate skills
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: python3 scripts/validate.py
